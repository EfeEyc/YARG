name: Builds - iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the .ipa artifact"
        required: false
        default: "0.13-ios"
        type: string
  push:
    branches:
      - ios-port

jobs:
  iosBuilder:
    name: iOS Build (${{ inputs.version || '0.13-ios' }})
    runs-on: macos-latest

    steps:
      ###########################
      #         Checkout        #
      ###########################
      - name: "[Pre-install] Checkout repository and submodules"
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: "[Pre-install] Ensure YARG.Core iOS P/Invoke bindings and IL2CPP compatibility"
        run: |
          python3 - << 'EOF'
          from pathlib import Path
          p = Path("YARG.Core/YARG.Core/IO/Images/YARGImage.cs")
          text = p.read_text(encoding="utf-8")
          if "UNITY_IOS" not in text:
              target = '[DllImport("STB2CSharp", EntryPoint = "load_image_from_memory")]'
              replacement = """#if UNITY_IOS && !UNITY_EDITOR
                  private const string StbDllName = "__Internal";
          #else
                  private const string StbDllName = "STB2CSharp";
          #endif

                  [DllImport(StbDllName, EntryPoint = "load_image_from_memory")]"""
              text = text.replace(target, replacement, 1)
              text = text.replace('[DllImport("STB2CSharp", EntryPoint = "free_image")]', '[DllImport(StbDllName, EntryPoint = "free_image")]', 1)
              p.write_text(text, encoding="utf-8")
              print("Patched YARGImage.cs for iOS static linking (__Internal).")

          # Patch SongEntry.Sorting.cs to replace raw function pointer array delegate*[] with managed delegates
          p_sort = Path("YARG.Core/YARG.Core/Song/Entries/SongEntry.Sorting.cs")
          s_text = p_sort.read_text(encoding="utf-8")
          if "delegate*<SongCache" in s_text:
              s_old = """        private static readonly unsafe delegate*<SongCache, Dictionary<SongEntry, CacheWriteIndices>, List<string>>[] COLLECTORS =
          {
              &CollectCacheTitles, &CollectCacheArtists,  &CollectCacheAlbums,    &CollectCacheGenres, &CollectCacheSubgenres,
              &CollectCacheYears,  &CollectCacheCharters, &CollectCachePlaylists, &CollectCacheSources,
          };"""
              s_new = """        private delegate List<string> CollectorDelegate(SongCache cache, Dictionary<SongEntry, CacheWriteIndices> nodes);

          private static readonly CollectorDelegate[] COLLECTORS =
          {
              CollectCacheTitles, CollectCacheArtists,  CollectCacheAlbums,    CollectCacheGenres, CollectCacheSubgenres,
              CollectCacheYears,  CollectCacheCharters, CollectCachePlaylists, CollectCacheSources,
          };"""
              s_text = s_text.replace(s_old.replace("          ", "        "), s_new.replace("          ", "        "))
              s_text = s_text.replace("""                unsafe
                  {
                      categories[i] = COLLECTORS[i](cache, nodes);
                  }""".replace("                  ", "                "), "categories[i] = COLLECTORS[i](cache, nodes);")
              p_sort.write_text(s_text, encoding="utf-8")
              print("Patched SongEntry.Sorting.cs for IL2CPP compatibility.")
          EOF

      ###########################
      #          Cache          #
      ###########################
      - name: "[Pre-install] Restore Unity Library cache"
        uses: actions/cache@v4
        with:
          path: Library
          key: YARG-Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'Assets/packages.config') }}
          restore-keys: |
            YARG-Library-iOS-
            YARG-Library-

      ###########################
      #     Install Blender     #
      ###########################
      - name: "[Pre-install] Cache Blender (3.4.1)"
        id: blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/BlenderInstall
          key: blender-3.4.1
          restore-keys: blender-

      - if: ${{ steps.blender.outputs.cache-hit != 'true' }}
        name: "[Pre-install] Download Blender (3.4.1)"
        continue-on-error: true
        run: |
          mkdir -p "${{ runner.temp }}/BlenderInstall"
          curl -L -o "${{ runner.temp }}/BlenderInstall/blender.dmg" https://download.blender.org/release/Blender3.4/blender-3.4.1-macos-arm64.dmg

      - name: "[Pre-install] Install Blender (3.4.1)"
        continue-on-error: true
        run: |
          hdiutil attach "${{ runner.temp }}/BlenderInstall/blender.dmg"
          cp -R /Volumes/Blender/Blender.app /Applications
          hdiutil unmount /Volumes/Blender

      ###########################
      #    Download BASS iOS    #
      ###########################
      - name: "[Pre-install] Download Un4seen BASS iOS XCFrameworks"
        run: |
          BASS_DIR="${{ runner.temp }}/bass-ios"
          rm -rf "$BASS_DIR" /tmp/bass-ios
          mkdir -p "$BASS_DIR/frameworks" /tmp/bass-ios/frameworks
          cd "$BASS_DIR"

          curl -fL -A "Mozilla/5.0" -o bass24-ios.zip "https://www.un4seen.com/files/bass24-ios.zip"
          curl -fL -A "Mozilla/5.0" -o bass_fx24-ios.zip "https://www.un4seen.com/files/z/0/bass_fx24-ios.zip"
          curl -fL -A "Mozilla/5.0" -o bassmix24-ios.zip "https://www.un4seen.com/files/bassmix24-ios.zip"
          curl -fL -A "Mozilla/5.0" -o bassopus24-ios.zip "https://www.un4seen.com/files/bassopus24-ios.zip"

          for zip in bass24-ios.zip bass_fx24-ios.zip bassmix24-ios.zip bassopus24-ios.zip; do
            unzip -q -o "$zip" -d extracted
          done

          # Extract physical iOS device (arm64) framework slices, strip legacy 32-bit armv7/armv7s slices,
          # set executable permissions (0755), and stamp modern iOS 27.1 SDK build version
          for name in bass bass_fx bassmix bassopus; do
            fw="${name}.framework"
            SLICE=$(find extracted -type d -path "*ios-arm64*/$fw" ! -path "*simulator*" | head -n 1)
            if [ -n "$SLICE" ]; then
              cp -R "$SLICE" "$BASS_DIR/frameworks/$fw"
              BIN="$BASS_DIR/frameworks/$fw/$name"
              if ! lipo -info "$BIN" | grep -q "Non-fat"; then
                lipo -thin arm64 "$BIN" -output "${BIN}.arm64"
                mv "${BIN}.arm64" "$BIN"
              fi
              chmod 755 "$BIN"
              xcrun vtool -set-build-version ios 15.0 27.1 -replace -output "$BIN" "$BIN" || true
              /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$BASS_DIR/frameworks/$fw/Info.plist" 2>/dev/null || true
              cp -R "$BASS_DIR/frameworks/$fw" "/tmp/bass-ios/frameworks/$fw"
              echo "Prepared arm64 framework $fw from $SLICE"
              lipo -info "$BIN"
            else
              echo "Warning: Could not locate device slice for $fw"
            fi
          done

      ###########################
      #    Restore Packages     #
      ###########################
      - name: "[Pre-install] Setup .NET 9"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: "[Pre-install] Restore NuGet Packages"
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install --global NuGetForUnity.Cli || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore .

      ###########################
      #    Build Unity -> iOS   #
      ###########################
      - name: "[Build] Export Unity iOS Xcode Project"
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildName: YARG
          targetPlatform: iOS
          allowDirtyBuild: true
          versioning: None
          cacheUnityInstallationOnMac: true

      ###########################
      #  Compile & Package IPA  #
      ###########################
      - name: "[Post-build] Compile Xcode Project and Package Unsigned .ipa"
        run: |
          set -euo pipefail

          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting newest installed Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE" || true
          fi
          xcodebuild -version

          XCODE_PROJ=$(find build -name "Unity-iPhone.xcodeproj" -maxdepth 4 | head -n 1)
          if [ -z "$XCODE_PROJ" ] || [ ! -d "$XCODE_PROJ" ]; then
            echo "Error: Xcode project not found under build/"
            ls -laR build || true
            exit 1
          fi

          echo "Building Xcode project at: $XCODE_PROJ"
          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Compiled .app bundle not found!"
            exit 1
          fi

          echo "Found built app bundle at: $APP_PATH"
          mkdir -p "$APP_PATH/Frameworks"

          # Embed clean arm64 BASS iOS frameworks (no loose symlink files so on-device re-signing succeeds cleanly)
          BASS_FW_DIR="${{ runner.temp }}/bass-ios/frameworks"
          for name in bass bass_fx bassmix bassopus; do
            if [ -d "$BASS_FW_DIR/${name}.framework" ]; then
              rm -rf "$APP_PATH/Frameworks/${name}.framework" "$APP_PATH/Frameworks/${name}" "$APP_PATH/Frameworks/lib${name}.dylib"
              cp -R "$BASS_FW_DIR/${name}.framework" "$APP_PATH/Frameworks/"
              chmod 755 "$APP_PATH/Frameworks/${name}.framework/${name}"
              xcrun vtool -set-build-version ios 15.0 27.1 -replace \
                -output "$APP_PATH/Frameworks/${name}.framework/${name}" \
                "$APP_PATH/Frameworks/${name}.framework/${name}" || true
            fi
          done

          # Stamp main executable and UnityFramework with iOS 27.1 SDK in Mach-O LC_BUILD_VERSION
          if [ -f "$APP_PATH/YARG" ]; then
            chmod 755 "$APP_PATH/YARG"
            xcrun vtool -set-build-version ios 15.0 27.1 -replace -output "$APP_PATH/YARG" "$APP_PATH/YARG" || true
          fi
          if [ -f "$APP_PATH/Frameworks/UnityFramework.framework/UnityFramework" ]; then
            chmod 755 "$APP_PATH/Frameworks/UnityFramework.framework/UnityFramework"
            xcrun vtool -set-build-version ios 15.0 27.1 -replace \
              -output "$APP_PATH/Frameworks/UnityFramework.framework/UnityFramework" \
              "$APP_PATH/Frameworks/UnityFramework.framework/UnityFramework" || true
          fi

          # Ensure Info.plist metadata declares iOS 27.1 SDK and full dynamic screen resizing (no 16:9 compatibility box)
          PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreenIgnoredStartingWithVersion 26.0" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreenIgnoredStartingWithVersion string 26.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName~iphone" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName~ipod" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen-iPad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos27.1" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :DTPlatformVersion 27.1" "$PLIST" 2>/dev/null || true

          # Ad-hoc sign all embedded frameworks and the main app bundle
          find "$APP_PATH/Frameworks" -maxdepth 1 -name "*.framework" | while read -r item; do
            codesign --force --sign - --timestamp=none "$item"
          done
          codesign --force --sign - --timestamp=none "$APP_PATH"

          # Package into .ipa preserving bundle permissions and structure
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -Rp "$APP_PATH" build/ipa/Payload/YARG.app
          cd build/ipa
          zip -r -y -9 "${GITHUB_WORKSPACE}/YARG-iOS.ipa" Payload

      - name: "[Post-build] Upload .ipa Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: YARG-iOS-${{ inputs.version || '0.13-ios' }}
          path: YARG-iOS.ipa
          if-no-files-found: error
